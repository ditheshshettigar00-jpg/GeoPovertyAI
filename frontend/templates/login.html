{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Login to GeoPovertyAI</h2>
    <form id="login-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <div>
            <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
            <input type="email" id="email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div>
            <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
            <input type="password" id="password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div id="error-message" style="color: red; display: none;"></div>
        <button type="submit" style="padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Don't have an account? <a href="/register">Register here</a></p>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            window.location.href = '/'; // redirect to home on success
        } else {
            errorDiv.textContent = data.error || 'Login failed';
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.textContent = 'An error occurred during login.';
        errorDiv.style.display = 'block';
    }
});
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Register for GeoPovertyAI</h2>
    <form id="register-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <div>
            <label for="name" style="display: block; margin-bottom: 5px;">Full Name</label>
            <input type="text" id="name" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div>
            <label for="email" style="display: block; margin-bottom: 5px;">Email</label>
            <input type="email" id="email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div>
            <label for="password" style="display: block; margin-bottom: 5px;">Password</label>
            <input type="password" id="password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div id="error-message" style="color: red; display: none;"></div>
        <div id="success-message" style="color: green; display: none;"></div>
        <button type="submit" style="padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer;">Register</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Already have an account? <a href="/login">Login here</a></p>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');
    
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            successDiv.textContent = 'Registration successful! Redirecting to login...';
            successDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        } else {
            errorDiv.textContent = data.error || 'Registration failed';
            errorDiv.style.display = 'block';
        }
    } catch (err) {
        errorDiv.textContent = 'An error occurred during registration.';
        errorDiv.style.display = 'block';
    }
});
</script>
{% endblock %}
